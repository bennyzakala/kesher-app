[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"

# The service worker must always be re-checked so app updates reach installed phones
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
